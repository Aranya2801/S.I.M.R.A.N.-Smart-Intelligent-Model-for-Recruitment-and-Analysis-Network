[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simran"
version = "3.0.0"
description = "Explainable resume-to-job matching with a reproducible benchmark"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aranya Ghosh" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
simran = "simran.cli:main"

[tool.setuptools.packages.find]
include = ["simran*"]

[tool.setuptools.package-data]
simran = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
